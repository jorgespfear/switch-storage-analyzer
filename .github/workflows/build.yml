name: Build NRO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SDL2 para Switch
        run: dkp-pacman -Syu --noconfirm switch-sdl2
      - name: Compilar
        run: make
      - name: Subir el .nro
        uses: actions/upload-artifact@v4
        with:
          name: SwitchStorageAnalyzer-nro
          path: SwitchStorageAnalyzer.nro
